<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - CollegeConnect</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav id="app-nav"></nav>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="lead">Enter your registered email to generate a reset token, then set a new password.</p>
      <div id="form-msg"></div>

      <form id="step1" class="form-grid">
        <div class="field">
          <label for="email">Registered email</label>
          <input type="email" id="email" required placeholder="you@college.edu">
        </div>
        <button class="btn btn-block" type="submit" id="req-btn">Generate Reset Token</button>
      </form>

      <form id="step2" class="form-grid" style="display:none">
        <div class="field">
          <label for="token">Reset token</label>
          <input type="text" id="token" required placeholder="Paste the token you received">
          <span class="hint">In this build the token is delivered to your in-app notifications. In production it would be emailed.</span>
        </div>
        <div class="field">
          <label for="new_password">New password</label>
          <input type="password" id="new_password" required minlength="8" placeholder="Min 8 characters">
        </div>
        <button class="btn btn-block" type="submit" id="reset-btn">Set New Password</button>
      </form>

      <div class="auth-foot"><a href="/login.html">Back to login</a></div>
    </div>
  </div>
  <footer id="app-footer"></footer>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    'use strict';
    (function () {
      const msg = document.getElementById('form-msg');
      const step1 = document.getElementById('step1');
      const step2 = document.getElementById('step2');

      step1.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('req-btn');
        btn.disabled = true; btn.textContent = 'Generating...';
        try {
          const res = await API.post('/auth/forgot-password', { email: document.getElementById('email').value.trim() });
          msg.innerHTML = `<div class="ok-box">${UI.esc(res.message)}</div>`;
          step1.style.display = 'none';
          step2.style.display = 'grid';
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${UI.esc(err.message)}</div>`;
        }
        btn.disabled = false; btn.textContent = 'Generate Reset Token';
      });

      step2.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('reset-btn');
        btn.disabled = true; btn.textContent = 'Saving...';
        try {
          await API.post('/auth/reset-password', {
            token: document.getElementById('token').value.trim(),
            new_password: document.getElementById('new_password').value,
          });
          location.href = '/login.html?reset=1';
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${UI.esc(err.message)}</div>`;
          btn.disabled = false; btn.textContent = 'Set New Password';
        }
      });
    })();
  </script>
</body>
</html>
