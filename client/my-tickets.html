<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tickets - CollegeConnect</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .filter-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }
    .filter-tab {
      background: none;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all var(--speed);
    }
    .filter-tab.active {
      background: var(--sky-light);
      color: var(--primary);
    }
    .ticket-copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--primary);
      font-size: 13px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .ticket-copy-btn:hover { background: rgba(7, 86, 201, 0.1); }
  </style>
</head>
<body>
  <nav id="app-nav"></nav>

  <div class="container">
    <div class="page-head">
      <div>
        <h1>My Event Tickets</h1>
        <div class="sub">Your verified digital passes with entry QR codes for registered events.</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn btn-secondary" href="/events.html">Browse Events</a>
        <a class="btn btn-secondary" href="/my-registrations.html">Registrations</a>
      </div>
    </div>

    <!-- Filter tabs -->
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">All Tickets (<span id="count-all">0</span>)</button>
      <button class="filter-tab" data-filter="upcoming">Upcoming (<span id="count-upcoming">0</span>)</button>
      <button class="filter-tab" data-filter="checked_in">Checked In (<span id="count-checked">0</span>)</button>
      <button class="filter-tab" data-filter="past">Past / Expired (<span id="count-past">0</span>)</button>
    </div>

    <!-- Ticket Cards Grid -->
    <div id="tickets-container">
      <div class="loading">Loading your tickets...</div>
    </div>
  </div>

  <!-- Ticket Voucher Modal for Viewing & Printing -->
  <div id="ticket-modal" class="modal-overlay" style="display:none">
    <div class="modal" style="max-width:540px;padding:0;background:transparent;border:none;box-shadow:none">
      <div class="voucher-pass" id="printable-voucher">
        <!-- Rendered dynamically -->
      </div>
      <div class="modal-actions no-print" style="margin-top:14px;justify-content:center;gap:12px">
        <button class="btn btn-secondary" id="close-modal-btn">Close</button>
        <button class="btn" id="print-ticket-btn">&#128424; Download PDF / Print</button>
      </div>
    </div>
  </div>

  <footer id="app-footer"></footer>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    'use strict';
    (async function () {
      const user = Auth.requireRole(['STUDENT', 'ORGANIZER', 'CLUB_COORDINATOR', 'FACULTY', 'ADMIN']);
      if (!user) return;

      const container = document.getElementById('tickets-container');
      const tabs = document.querySelectorAll('.filter-tab');
      let allTickets = [];
      let currentFilter = 'all';

      function getBadgeClass(status) {
        const s = (status || '').toLowerCase().replace(/[\s-]/g, '_');
        if (s === 'valid') return 'valid';
        if (s === 'checked_in') return 'checked_in';
        if (s === 'cancelled') return 'cancelled';
        return 'expired';
      }

      function getStatusLabel(status) {
        if (status === 'VALID') return '&#10003; Valid Ticket';
        if (status === 'CHECKED_IN') return '&#128100; Checked In';
        if (status === 'CANCELLED') return '&#10007; Cancelled';
        return 'Expired';
      }

      function isUpcoming(t) {
        if (!t.event_date) return true;
        const d = new Date(t.event_date + (t.end_time ? 'T' + t.end_time : 'T23:59:59'));
        return d >= new Date() && t.status === 'VALID';
      }

      function updateCounts() {
        const total = allTickets.length;
        const up = allTickets.filter(isUpcoming).length;
        const chk = allTickets.filter((t) => t.status === 'CHECKED_IN').length;
        const past = allTickets.filter((t) => t.status === 'EXPIRED' || (!isUpcoming(t) && t.status !== 'CHECKED_IN')).length;

        document.getElementById('count-all').textContent = total;
        document.getElementById('count-upcoming').textContent = up;
        document.getElementById('count-checked').textContent = chk;
        document.getElementById('count-past').textContent = past;
      }

      function filterTickets() {
        if (currentFilter === 'all') return allTickets;
        if (currentFilter === 'upcoming') return allTickets.filter(isUpcoming);
        if (currentFilter === 'checked_in') return allTickets.filter((t) => t.status === 'CHECKED_IN');
        if (currentFilter === 'past') return allTickets.filter((t) => t.status === 'EXPIRED' || (!isUpcoming(t) && t.status !== 'CHECKED_IN'));
        return allTickets;
      }

      function render() {
        const list = filterTickets();
        if (!list.length) {
          container.innerHTML = UI.empty(
            'No tickets found',
            currentFilter === 'all'
              ? 'You have not registered for any events yet. Check out upcoming campus events!'
              : `No tickets match the "${currentFilter}" filter.`
          );
          return;
        }

        container.innerHTML = `<div class="ticket-grid">
          ${list.map((t) => `
            <div class="ticket-card" data-id="${t.id}">
              <div class="ticket-card-header" style="display:flex;justify-content:space-between;align-items:flex-start">
                <div>
                  <span class="badge" style="margin-bottom:6px">${UI.esc(t.category || 'EVENT')}</span>
                  <h3 style="margin:4px 0 2px;font-size:17px"><a href="/event-details.html?id=${t.event_id}">${UI.esc(t.event_title)}</a></h3>
                </div>
                <span class="ticket-status-badge ${getBadgeClass(t.status)}">${getStatusLabel(t.status)}</span>
              </div>

              <div class="ticket-body">
                <div class="ticket-detail-row">
                  <span class="icon">&#128197;</span>
                  <span><b>${UI.fmtDate(t.event_date)}</b> &middot; ${UI.fmtTime(t.start_time)}</span>
                </div>
                <div class="ticket-detail-row">
                  <span class="icon">&#128205;</span>
                  <span>${UI.esc(t.venue || 'Campus Venue')}</span>
                </div>
                <div class="ticket-detail-row">
                  <span class="icon">&#127891;</span>
                  <span>${UI.esc(t.student_name)} &middot; <span class="mono">${UI.esc(t.student_reg_no || t.registration_number)}</span></span>
                </div>

                <div class="ticket-qr-section">
                  <div>
                    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:3px">Ticket Code</div>
                    <span class="ticket-code-display">${UI.esc(t.ticket_code)}</span>
                    <button class="ticket-copy-btn" data-copy="${UI.esc(t.ticket_code)}" title="Copy Ticket Code">&#128203; Copy</button>
                    ${t.checked_in_at ? `<div style="font-size:11.5px;color:var(--primary);margin-top:4px">Checked in: ${UI.fmtDateTime(t.checked_in_at)}</div>` : ''}
                  </div>
                  <img class="ticket-qr-img" src="${t.qr_data_url}" alt="QR code for ${UI.esc(t.ticket_code)}">
                </div>
              </div>

              <div class="ticket-footer">
                <button class="btn btn-sm" data-action="view" data-id="${t.id}">&#128065; View Ticket</button>
                <button class="btn btn-sm btn-secondary" data-action="print" data-id="${t.id}">&#128424; Print / PDF</button>
                <a class="btn btn-sm btn-secondary" href="/event-details.html?id=${t.event_id}">Event Details</a>
              </div>
            </div>
          `).join('')}
        </div>`;
      }

      function openVoucherModal(ticket, autoPrint = false) {
        const modal = document.getElementById('ticket-modal');
        const box = document.getElementById('printable-voucher');

        box.innerHTML = `
          <div class="voucher-pass-top">
            <span class="badge" style="background:rgba(255,255,255,0.2);color:#fff;border:none;margin-bottom:8px">${UI.esc(ticket.category || 'CAMPUS EVENT')}</span>
            <h2>${UI.esc(ticket.event_title)}</h2>
            <div class="sub">CollegeConnect Official Entry Pass &middot; ID #${ticket.id}</div>
          </div>
          <div class="voucher-pass-middle">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-size:12px;color:var(--muted);text-transform:uppercase">Attendee</div>
                <div style="font-size:16px;font-weight:700">${UI.esc(ticket.student_name)}</div>
                <div style="font-size:13px;color:var(--ink-soft)">Reg No: ${UI.esc(ticket.student_reg_no || ticket.registration_number)} &middot; ${UI.esc(ticket.department_name || '')}</div>
              </div>
              <span class="ticket-status-badge ${getBadgeClass(ticket.status)}" style="font-size:13px;padding:6px 12px">${getStatusLabel(ticket.status)}</span>
            </div>

            <div class="voucher-stub-divider"></div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13.5px">
              <div>
                <div style="font-size:11.5px;color:var(--muted);text-transform:uppercase">Date & Time</div>
                <b>${UI.fmtDate(ticket.event_date)}</b><br>
                <span>${UI.fmtTime(ticket.start_time)} ${ticket.end_time ? ' - ' + UI.fmtTime(ticket.end_time) : ''}</span>
              </div>
              <div>
                <div style="font-size:11.5px;color:var(--muted);text-transform:uppercase">Venue</div>
                <b>${UI.esc(ticket.venue || 'Campus Auditorium')}</b>
              </div>
            </div>

            <div class="voucher-qr-wrap">
              <img src="${ticket.qr_data_url}" alt="Ticket QR">
              <div class="ticket-code-display" style="font-size:16px">${UI.esc(ticket.ticket_code)}</div>
              <div style="font-size:11.5px;color:var(--muted);margin-top:6px">Present this QR code or Ticket Code at the entrance.</div>
            </div>

            ${ticket.checked_in_at ? `
              <div style="background:var(--info-soft);padding:10px 14px;border-radius:8px;font-size:12.5px;color:var(--primary);text-align:center">
                &#10003; Entry recorded at ${UI.fmtDateTime(ticket.checked_in_at)}
              </div>` : ''}
          </div>
        `;

        modal.style.display = 'flex';

        if (autoPrint) {
          setTimeout(() => window.print(), 350);
        }
      }

      // Event Listeners
      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          tabs.forEach((t) => t.classList.remove('active'));
          tab.classList.add('active');
          currentFilter = tab.dataset.filter;
          render();
        });
      });

      container.addEventListener('click', (e) => {
        const copyBtn = e.target.closest('[data-copy]');
        if (copyBtn) {
          navigator.clipboard.writeText(copyBtn.dataset.copy);
          UI.toast('Ticket code copied to clipboard', 'success');
          return;
        }

        const viewBtn = e.target.closest('[data-action="view"]');
        if (viewBtn) {
          const t = allTickets.find((x) => x.id === Number(viewBtn.dataset.id));
          if (t) openVoucherModal(t, false);
          return;
        }

        const printBtn = e.target.closest('[data-action="print"]');
        if (printBtn) {
          const t = allTickets.find((x) => x.id === Number(printBtn.dataset.id));
          if (t) openVoucherModal(t, true);
          return;
        }
      });

      document.getElementById('close-modal-btn').addEventListener('click', () => {
        document.getElementById('ticket-modal').style.display = 'none';
      });

      document.getElementById('ticket-modal').addEventListener('click', (e) => {
        if (e.target.id === 'ticket-modal') {
          document.getElementById('ticket-modal').style.display = 'none';
        }
      });

      document.getElementById('print-ticket-btn').addEventListener('click', () => {
        window.print();
      });

      // Load tickets from API
      try {
        const res = await API.get('/tickets/my-tickets');
        allTickets = res.data || [];
        updateCounts();
        render();
      } catch (err) {
        container.innerHTML = `<div class="error-box">${UI.esc(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
