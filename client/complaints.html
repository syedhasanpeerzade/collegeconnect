<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaints - CollegeConnect</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav id="app-nav"></nav>
  <div class="container">
    <div class="page-head">
      <div><h1>Complaints</h1><div class="sub">Report campus issues and track them to resolution.</div></div>
      <button class="btn" id="new-complaint">Submit a Complaint</button>
    </div>
    <div id="content"><div class="loading">Loading...</div></div>
  </div>

  <!-- Submit modal -->
  <div class="modal-overlay" id="complaint-modal" style="display:none">
    <div class="modal" style="max-width:560px">
      <h3>Submit a complaint</h3>
      <form id="complaint-form" class="form-grid" novalidate>
        <div class="field">
          <label for="c-title">Title *</label>
          <input id="c-title" required minlength="5" maxlength="160" placeholder="Summarize the issue">
        </div>
        <div class="form-row">
          <div class="field">
            <label for="c-category">Category *</label>
            <select id="c-category">
              <option>INFRASTRUCTURE</option><option>CLASSROOM</option><option>LABORATORY</option>
              <option>WIFI</option><option>HOSTEL</option><option>CANTEEN</option>
              <option>LIBRARY</option><option>TRANSPORT</option><option>ACADEMICS</option><option>OTHER</option>
            </select>
          </div>
          <div class="field">
            <label for="c-priority">Priority</label>
            <select id="c-priority">
              <option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>URGENT</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="c-location">Location</label>
          <input id="c-location" placeholder="e.g. CSE Block, Room 301">
        </div>
        <div class="field">
          <label for="c-description">Description *</label>
          <textarea id="c-description" required minlength="20" placeholder="What is wrong, since when, and how does it affect you?"></textarea>
        </div>
        <div class="field">
          <label for="c-attachment">Photo / document (optional)</label>
          <input type="file" id="c-attachment" accept="image/*,.pdf">
        </div>
        <div id="form-msg"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="close-modal">Cancel</button>
          <button type="submit" class="btn" id="submit-btn">Submit Complaint</button>
        </div>
      </form>
    </div>
  </div>

  <footer id="app-footer"></footer>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    'use strict';
    (async function () {
      const user = Auth.requireRole(['STUDENT', 'ORGANIZER', 'CLUB_COORDINATOR', 'FACULTY', 'ADMIN']);
      if (!user) return;
      const box = document.getElementById('content');
      const modal = document.getElementById('complaint-modal');

      document.getElementById('new-complaint').addEventListener('click', () => { modal.style.display = 'flex'; });
      document.getElementById('close-modal').addEventListener('click', () => { modal.style.display = 'none'; });
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

      async function load() {
        box.innerHTML = UI.loadingBox('Loading complaints...');
        try {
          const res = await API.get('/complaints');
          const rows = res.data || [];
          if (!rows.length) {
            box.innerHTML = UI.empty('No complaints yet', 'Click "Submit a Complaint" to report an issue.');
            return;
          }
          box.innerHTML = `<div class="table-wrap"><table>
            <thead><tr><th>Complaint ID</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Submitted</th></tr></thead>
            <tbody>${rows.map((c) => `
              <tr>
                <td data-label="ID" class="mono">${UI.esc(c.public_id)}</td>
                <td data-label="Title"><a href="/complaint-details.html?id=${c.id}">${UI.esc(c.title)}</a></td>
                <td data-label="Category">${UI.categoryLabel(c.category)}</td>
                <td data-label="Priority">${UI.statusBadge(c.priority)}</td>
                <td data-label="Status">${UI.statusBadge(c.status)}</td>
                <td data-label="Submitted">${UI.fmtDate(c.created_at)}</td>
              </tr>`).join('')}</tbody>
          </table></div>`;
        } catch (err) {
          box.innerHTML = `<div class="error-box">${UI.esc(err.message)}</div>`;
        }
      }

      document.getElementById('complaint-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('form-msg');
        msg.innerHTML = '';
        const fd = new FormData();
        fd.append('title', document.getElementById('c-title').value.trim());
        fd.append('category', document.getElementById('c-category').value);
        fd.append('priority', document.getElementById('c-priority').value);
        fd.append('location', document.getElementById('c-location').value.trim());
        fd.append('description', document.getElementById('c-description').value.trim());
        const file = document.getElementById('c-attachment').files[0];
        if (file) fd.append('attachment', file);
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        try {
          const res = await API.postForm('/complaints', fd);
          UI.toast(res.message, 'success');
          modal.style.display = 'none';
          e.target.reset();
          load();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${UI.esc(err.message)}</div>`;
        }
        btn.disabled = false;
      });

      load();
    })();
  </script>
</body>
</html>
